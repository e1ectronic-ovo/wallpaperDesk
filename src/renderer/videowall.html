<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' data: blob: mediastream: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob: 'unsafe-inline'; media-src * data: blob: 'unsafe-inline'; style-src * 'unsafe-inline'; script-src * 'self' 'unsafe-inline' 'unsafe-eval'; connect-src * 'self' ws: wss: http: https: data: blob: 'unsafe-inline';"
    />
    <title>画境</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #video-wrap {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      #video-el {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: transparent;
        display: block;
      }
      #fallback-bg {
        display: none;
      }
      #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="fallback-bg"></div>
    <div id="video-wrap">
      <video
        id="video-el"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        webkit-playsinline
      ></video>
    </div>
    <div id="status"></div>

    <script type="module" src="./src/videowall.ts"></script>
  </body>
</html>
